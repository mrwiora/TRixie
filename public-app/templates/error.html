<!doctype html>
<html lang="{{.Lang}}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.T.ErrTitle}}</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=Arvo:400,700,400italic"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                border: 0;
                font: inherit;
                vertical-align: baseline;
            }
            body {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 14px;
                color: #232323;
                background-color: #fbfaf7;
                line-height: 1.8em;
                -webkit-font-smoothing: antialiased;
                padding: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            .container {
                max-width: 600px;
                text-align: center;
            }
            .error-icon {
                font-size: 80px;
                margin-bottom: 20px;
            }
            h1 {
                font-family: Arvo, Monaco, serif;
                font-size: 36px;
                font-weight: normal;
                color: #c30000;
                margin-bottom: 20px;
            }
            p {
                margin-bottom: 20px;
                line-height: 1.6;
                color: #666;
            }
            .info-box {
                background-color: #f0f0f0;
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 30px;
                margin: 30px 0;
                text-align: left;
            }
            .info-box h2 {
                font-family: Arvo, Monaco, serif;
                font-size: 20px;
                margin-bottom: 15px;
                color: #232323;
            }
            .info-box ul {
                list-style: none;
                padding-left: 0;
            }
            .info-box li {
                padding: 8px 0;
                padding-left: 25px;
                position: relative;
            }
            .info-box li:before {
                content: "•";
                position: absolute;
                left: 5px;
                color: #c30000;
                font-weight: bold;
            }
            code {
                background-color: #e9e9e9;
                padding: 2px 6px;
                border-radius: 3px;
                font-family: monospace;
                font-size: 12px;
            }
            .footer {
                margin-top: 40px;
                padding-top: 20px;
                border-top: 1px solid #ccc;
                color: #999;
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="error-icon">🔒</div>
            <h1>{{.T.ErrHeading}}</h1>
            <p>{{.T.ErrDesc}}</p>

            <div class="info-box">
                <h2>{{.T.ErrWhyTitle}}</h2>
                <ul>
                    <li>{{.T.ErrWhy1}}</li>
                    <li>{{.T.ErrWhy2}}</li>
                    <li>{{.T.ErrWhy3}}</li>
                    <li>{{.T.ErrWhy4}}</li>
                </ul>
            </div>

            <div class="info-box">
                <h2>{{.T.ErrWhatTitle}}</h2>
                <ul>
                    <li>{{.T.ErrWhat1}}</li>
                    <li>{{.T.ErrWhat2}}</li>
                    <li>{{.T.ErrWhat3}}</li>
                    <li>{{.T.ErrWhat4}}</li>
                </ul>
            </div>

            <p style="font-size: 12px; color: #999; margin-top: 30px">
                {{.T.ErrURLHint}}<br />
                <code>/ITEM-CODE?sig=...</code>
            </p>

            <div class="footer">
                <p>{{.T.ErrFooter}}</p>
            </div>
        </div>
    </body>
</html>
