<!doctype html>
<html lang="{{.Lang}}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TRixie</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=Arvo:400,700,400italic"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                border: 0;
                font: inherit;
                vertical-align: baseline;
            }
            body {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 14px;
                color: #232323;
                background-color: #fbfaf7;
                line-height: 1.8em;
                -webkit-font-smoothing: antialiased;
                padding: 20px;
            }
            .container {
                max-width: 800px;
                margin: 0 auto;
                padding: 40px 20px;
            }
            h1 {
                font-family: Arvo, Monaco, serif;
                font-size: 48px;
                font-weight: normal;
                color: #232323;
                margin-bottom: 20px;
                border-bottom: 2px solid #ccc;
                padding-bottom: 10px;
            }
            h2 {
                font-family: Arvo, Monaco, serif;
                font-size: 24px;
                font-weight: normal;
                color: #232323;
                margin: 30px 0 15px;
            }
            p {
                margin-bottom: 20px;
                line-height: 1.6;
            }
            .card {
                background-color: #f0f0f0;
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 30px;
                margin: 30px 0;
            }
            .features {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                margin: 30px 0;
            }
            .feature {
                background-color: #ffffff;
                border: 1px solid #ccc;
                border-radius: 4px;
                padding: 20px;
            }
            .feature h3 {
                font-family: Arvo, Monaco, serif;
                font-size: 18px;
                margin-bottom: 10px;
                color: #c30000;
            }
            .button {
                display: inline-block;
                background-color: #c30000;
                color: #ffffff;
                padding: 12px 30px;
                text-decoration: none;
                border-radius: 4px;
                font-weight: 600;
                margin: 10px 10px 10px 0;
                transition: background-color 0.3s;
            }
            .button:hover {
                background-color: #a00000;
            }
            .button-secondary {
                background-color: #666;
            }
            .button-secondary:hover {
                background-color: #444;
            }
            code {
                background-color: #e9e9e9;
                padding: 2px 6px;
                border-radius: 3px;
                font-family: monospace;
            }
            .footer {
                text-align: center;
                margin-top: 60px;
                padding-top: 20px;
                border-top: 1px solid #ccc;
                color: #666;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div
                style="
                    margin-top: 2rem;
                    padding: 1.5rem;
                    background-color: #f9f9f9;
                    border: 1px solid #e0e0e0;
                    border-radius: 4px;
                    text-align: center;
                "
            >
                <p style="font-size: 16px; color: #666; margin: 0">
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="#666"
                        style="
                            display: inline-block;
                            vertical-align: middle;
                            margin-right: 4px;
                        "
                    >
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                        />
                    </svg>
                    {{.T.FooterThanks}} {{.Version}}
                </p>
            </div>
        </div>
    </body>
</html>
